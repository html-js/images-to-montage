# Publishes the static page. Only index.html and the docs images are deployed;
# docs/samples/ is included so the README's "try it" link can load them.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/docs/figures _site/docs/samples
          cp index.html _site/
          cp docs/*.png docs/*.jpg _site/docs/
          cp docs/figures/*.png _site/docs/figures/
          cp docs/samples/*.jpg _site/docs/samples/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
